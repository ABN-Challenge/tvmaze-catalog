name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-tvmaze-catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tvmaze-catalog
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          path: tvmaze-catalog
      - name: Checkout tvmaze-ui sibling (Storybook aliases)
        uses: actions/checkout@v4
        with:
          repository: ABN-Challenge/tvmaze-ui
          path: tvmaze-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: tvmaze-catalog/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NODE_ENV: production
          VITE_UI_REMOTE_URL: https://abn-challenge.github.io/tvmaze-ui/remoteEntry.js
      - run: npm run build-storybook
      - name: Merge Storybook root with federation remote
        run: |
          mkdir -p pages-dist
          cp -R storybook-static/. pages-dist/
          cp dist/remoteEntry.js pages-dist/remoteEntry.js
          if [ -d dist/assets ]; then
            mkdir -p pages-dist/assets
            shopt -s nullglob
            for f in dist/assets/*; do
              base=$(basename "$f")
              if [ ! -e "pages-dist/assets/$base" ]; then
                cp -R "$f" "pages-dist/assets/$base"
              fi
            done
          fi
          shopt -s nullglob
          for f in dist/*; do
            base=$(basename "$f")
            case "$base" in
              index.html|assets|remoteEntry.js) continue ;;
            esac
            if [ ! -e "pages-dist/$base" ]; then
              cp -R "$f" "pages-dist/$base"
            fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tvmaze-catalog/pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
